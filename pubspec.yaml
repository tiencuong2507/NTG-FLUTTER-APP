name: ntg_app
description: Chat Nội Bộ - Nam Thinh Group
publish_to: 'none'
version: 1.0.9+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  dio_cache_interceptor: ^4.0.5

  # State Management - nhẹ nhất
  get: ^4.6.6

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  badges: ^3.1.2

  # Media
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  photo_view: ^0.15.0
  video_player: ^2.8.2
  just_audio: ^0.10.5

  # Push Notification
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^19.5.0

  # FIX: Bỏ flutter_webrtc - dùng url_launcher cho call thay thế
  # flutter_webrtc: ^1.3.1

  # Connectivity & Battery aware
  connectivity_plus: ^7.0.0
  battery_plus: ^7.0.0

  # Utils
  intl: ^0.20.2
  timeago: ^3.6.1
  uuid: ^4.3.3
  permission_handler: ^12.0.1
  url_launcher: ^6.2.4
  share_plus: ^12.0.1
  open_filex: ^4.3.4

  # Icons
  cupertino_icons: ^1.0.6
  flutter_phosphor_icons: ^0.0.1+6
  package_info_plus: ^9.0.0
  record: ^6.2.0
  audioplayers: ^6.6.0
  speech_to_text: ^7.3.0
  path_provider: ^2.1.5
  geolocator: ^13.0.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - assets/animations/
